<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>POC · Share-card Engine · แม่หมอบาร่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Noto+Sans+Thai:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-tokens.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--grad-page); color: #fff9ee; font-family: var(--font);
         min-height: 100vh; padding: 22px; line-height: 1.5; }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 21px; letter-spacing: -.03em; margin: 0 0 4px; }
  h1 .em { color: var(--gold); }
  p.sub { font-size: 13px; color: rgba(255,249,238,.72); margin: 0 0 16px; }
  .preview { width: 100%; border-radius: 22px; overflow: hidden; display: block;
             box-shadow: 0 22px 60px rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.12); }
  .cta { display: grid; gap: 10px; margin-top: 14px; }
  button { width: 100%; padding: 15px; border: 0; border-radius: 18px; color: #fff; font-size: 15px;
           font-weight: 900; cursor: pointer; font-family: var(--font);
           display: flex; align-items: center; justify-content: center; gap: 8px; }
  button:active { transform: scale(.985); }
  .b1 { background: var(--grad-primary); box-shadow: 0 12px 26px rgba(124,77,255,.3); }
  .b2 { background: rgba(255,255,255,.11); border: 1px solid rgba(255,255,255,.18); }
  .b3 { background: var(--grad-gold); color: var(--deep); box-shadow: 0 12px 26px rgba(247,201,111,.22); }
  .label { font-size: 12px; color: var(--gold); margin: 18px 0 6px; font-weight: 700; }
  pre { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.1); border-radius: 14px;
        padding: 12px; font-size: 12px; white-space: pre-wrap; color: #d9ffe9;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="em">🔮</span> POC · Share-card Engine</h1>
  <p class="sub">Unblocker B — เรนเดอร์ผลลัพธ์เป็น <b>รูป</b> ฝั่ง client (canvas) · palette "Cute Mystic Premium" · ใช้ซ้ำได้ทุกผลลัพธ์</p>

  <canvas id="card" class="preview"></canvas>

  <div class="cta">
    <button class="b1" id="share">📤 แชร์การ์ด (Web Share)</button>
    <button class="b3" id="download">⬇️ ดาวน์โหลด PNG</button>
    <button class="b2" id="shuffle">🎲 สุ่มผลใหม่ (data-driven)</button>
  </div>

  <div class="label">data ที่ป้อนเข้า engine</div>
  <pre id="dataDump"></pre>
  <div class="label">สถานะ</div>
  <pre id="status">กำลังเรนเดอร์…</pre>
</div>

<script src="share-card.js?v=s3"></script>
<script>
  const canvas = document.getElementById('card');
  const statusEl = document.getElementById('status');
  const dumpEl = document.getElementById('dataDump');

  // sample data (ฝั่ง app จะส่งของจริงเข้ามาผ่าน Fortune.shareData)
  const SAMPLES = [
    { power:78, colorName:'ชมพูพีช', colorHex:'#ff9fcf', number:'8 9', time:'09:09', kind:'ดวงความรัก', name:'ตอง', headline:'วันนี้พลังเสน่ห์แรง รักกำลังมาเคาะประตู ✨', date:'28 มิ.ย. 2569' },
    { power:92, colorName:'ครีมเหลือง', colorHex:'#f7c96f', number:'9 3', time:'14:00', kind:'ดวงการเงิน', name:'', headline:'การเงินไหลเข้า มีโชคก้อนเล็กแบบไม่คาดคิด', date:'28 มิ.ย. 2569' },
    { power:64, colorName:'มิ้นต์', colorHex:'#a8e6cf', number:'3 7', time:'07:30', kind:'ดวงวันนี้', name:'มิว', headline:'ใจเย็นไว้แล้วจะผ่านฉลุย งานคืบหน้าแน่นอน', date:'28 มิ.ย. 2569' },
  ];
  let idx = 0, current = SAMPLES[0];

  async function show(d) {
    statusEl.textContent = 'กำลังเรนเดอร์…';
    dumpEl.textContent = JSON.stringify(d, null, 2);
    await ShareCard.render(canvas, d);
    statusEl.textContent = '✓ เรนเดอร์เสร็จ (' + ShareCard.W + '×' + ShareCard.H + ')';
  }

  document.getElementById('shuffle').onclick = () => { idx = (idx + 1) % SAMPLES.length; current = SAMPLES[idx]; show(current); };
  document.getElementById('download').onclick = async () => { await ShareCard.download(canvas); statusEl.textContent = '⬇️ ดาวน์โหลดแล้ว'; };
  document.getElementById('share').onclick = async () => {
    const ok = await ShareCard.share(canvas, current);
    statusEl.textContent = ok ? '📤 แชร์สำเร็จ' : 'ℹ️ อุปกรณ์นี้ไม่รองรับ Web Share — ดาวน์โหลดให้แทนแล้ว (บนมือถือจริงจะแชร์ได้)';
  };

  show(current);
</script>
</body>
</html>
